[project]
name = "neon-autoresearch"
version = "0.1.0"
description = "Karpathy's autoresearch, run head to head: Gemini 4 Neon vs Claude Opus 5.5"
requires-python = ">=3.10"
dependencies = [
    # Karpathy's autoresearch dependencies (unchanged)
    "kernels==0.12.1",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "requests>=2.32.0",
    "huggingface-hub==1.5.0",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
    "torch==2.9.1",
    # harness only (never importable by train.py: the guard blocks network libraries)
    "google-genai>=1.50",
    "anthropic>=0.75",
]

[project.optional-dependencies]
video = ["playwright>=1.45"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
