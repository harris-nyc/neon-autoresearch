<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neon-autoresearch · overnight run</title>
<style>
  :root {
    --bg: #0D1117; --panel: #151B23; --panel2: #1B222C; --line: #262E39; --grid: #212833;
    --ink: #E8EDF3; --ink2: #A3AEBB; --muted: #6E7A88; --good: #3FB27F; --bad: #E5534B;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { padding: 28px 32px 40px; max-width: 1440px; margin: 0 auto; }
  .banner { background: repeating-linear-gradient(135deg, #3a2a10 0 12px, #2e220e 12px 24px); border: 1px solid #6b4e1c;
            color: #F2C46D; font: 600 13px var(--mono); padding: 8px 14px; border-radius: 8px; margin-bottom: 18px; letter-spacing: .02em; }
  header h1 { font-size: 34px; line-height: 1.1; margin: 0 0 8px; letter-spacing: -0.02em; font-weight: 750; }
  header .sub { color: var(--ink2); font-size: 15px; }
  header .sub b { color: var(--ink); font-weight: 600; }
  .vs { display: inline-flex; gap: 10px; align-items: center; margin-top: 14px; font: 600 14px var(--mono); }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  .controls { display: flex; align-items: center; gap: 14px; margin: 24px 0 18px; flex-wrap: wrap; }
  button, .seg button { font: 600 13px var(--sans); color: var(--ink); background: var(--panel2); border: 1px solid var(--line);
                        border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  button:hover { border-color: #3a4554; }
  #play { background: var(--ink); color: var(--bg); border-color: var(--ink); min-width: 104px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; color: var(--ink2); padding: 8px 12px; }
  .seg button.on { background: var(--panel2); color: var(--ink); }
  input[type=range] { flex: 1; min-width: 160px; accent-color: var(--ink); }
  .clock { font: 700 22px var(--mono); min-width: 190px; text-align: right; font-variant-numeric: tabular-nums; }
  .clock small { color: var(--muted); font-weight: 500; font-size: 14px; }

  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; position: relative; overflow: hidden; }
  .card .stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
  .card .who { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .card .who b { font-size: 18px; }
  .card .who span { color: var(--muted); font: 12px var(--mono); }
  .card .big { display: flex; align-items: baseline; gap: 12px; margin: 10px 0 12px; }
  .card .big .v { font: 750 44px var(--mono); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .card .big .g { font: 700 16px var(--mono); }
  .card .big .lab { color: var(--muted); font-size: 12px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 12px; }
  .stats div { font: 600 16px var(--mono); font-variant-numeric: tabular-nums; }
  .stats div small { display: block; color: var(--muted); font: 500 11px var(--sans); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
  .card.pulse { animation: pulse 1.1s ease-out; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--pc); } 100% { box-shadow: 0 0 0 18px transparent; } }

  .main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink2); margin: 0 0 10px; font-weight: 650;
              display: flex; justify-content: space-between; align-items: center; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--ink2); font-size: 12px; margin: 2px 0 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  svg text { font-family: var(--mono); }
  #chart { width: 100%; height: auto; display: block; }
  .tip { position: fixed; pointer-events: none; background: #0B0F14; border: 1px solid #39424f; border-radius: 10px; padding: 10px 12px;
         font-size: 13px; max-width: 340px; box-shadow: 0 8px 24px rgba(0,0,0,.45); display: none; z-index: 10; line-height: 1.4; }
  .tip .h { font: 600 12px var(--mono); color: var(--ink2); margin-bottom: 4px; }

  #feed { list-style: none; margin: 0; padding: 0; overflow-y: auto; max-height: 520px; }
  #feed li { border-left: 3px solid; background: var(--panel2); border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; animation: in .35s ease-out; }
  #feed li.discard, #feed li.crash, #feed li.timeout { opacity: .62; }
  #feed .top { display: flex; justify-content: space-between; font: 600 11px var(--mono); color: var(--ink2); margin-bottom: 4px; gap: 8px; }
  #feed .hyp { font-size: 13.5px; line-height: 1.35; }
  .pill { font: 700 10px var(--mono); padding: 2px 7px; border-radius: 999px; text-transform: uppercase; letter-spacing: .06em; }
  .pill.keep { background: rgba(63,178,127,.16); color: #69d3a1; }
  .pill.discard { background: #262d37; color: var(--ink2); }
  .pill.crash, .pill.timeout, .pill.rejected { background: rgba(229,83,75,.15); color: #f08a84; }
  .pill.baseline { background: #262d37; color: var(--ink); }
  @keyframes in { from { opacity: 0; transform: translateY(-6px); } }

  table { width: 100%; border-collapse: collapse; font: 14px var(--mono); font-variant-numeric: tabular-nums; }
  th { text-align: left; color: var(--muted); font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 10px; border-bottom: 1px solid var(--grid); }
  .final { margin-top: 14px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 22px; line-height: 1.6; }
  @media (max-width: 900px) {
    body { padding: 18px 14px 30px; } header h1 { font-size: 26px; }
    .main { grid-template-columns: 1fr; } th:nth-child(5), td:nth-child(5), th:nth-child(6), td:nth-child(6) { display: none; } table { font-size: 12.5px; } td, th { padding: 8px 6px; } .card .big .v { font-size: 36px; } .clock { min-width: 0; text-align: left; }
  }
</style>
</head>
<body>
<div id="banner" class="banner" hidden></div>
<header>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="vs" id="vs"></div>
</header>

<div class="controls">
  <button id="play">▶ Replay</button>
  <div class="seg" id="speed"><button data-s="10">10s</button><button data-s="20" class="on">20s</button><button data-s="40">40s</button></div>
  <input type="range" id="scrub" min="0" max="1000" value="1000" aria-label="time">
  <div class="seg" id="xmode"><button data-m="t" class="on">Hours</button><button data-m="id">Experiment #</button><button data-m="cum">$ spent</button></div>
  <div class="clock" id="clock"></div>
</div>

<section class="board" id="board"></section>

<section class="main">
  <div class="panel">
    <h2><span>Best val_bpb so far · lower is better ↓</span><span id="ylab" style="color:var(--muted);text-transform:none;letter-spacing:0"></span></h2>
    <div class="legend" id="legend"></div>
    <svg id="chart" viewBox="0 0 900 430" role="img" aria-label="race chart"></svg>
  </div>
  <div class="panel">
    <h2><span>Ideas, as they were tried</span>
      <span class="seg" id="feedmode"><button data-f="all" class="on">All</button><button data-f="keep">Kept</button></span></h2>
    <ul id="feed"></ul>
  </div>
</section>

<section class="panel final" id="final" hidden>
  <h2><span>Held-out test shard (never seen during the night) · retrained from scratch, mean ± std over seeds</span></h2>
  <div style="overflow-x:auto"><table id="ftable"></table></div>
</section>

<footer id="foot"></footer>
<div class="tip" id="tip"></div>

// baseline + noise band
const base0 = D.arms.map(a => a.rows.find(r => r.status === "baseline")).filter(Boolean)[0];

// derived per-arm series
for (const a of D.arms) {
  let best = null;

}
const allRows = D.arms.flatMap(a => a.rows);
const Tmax = Math.max(...allRows.map(r => r.t), 1e-6);

// ---------- state ----------
let T = Tmax, xmode = "t", feedmode = "all", playing = false, dur = 20, lastFrame = 0, shownIds = new Set(), prevKeeps = {};

function visible(a) { return a.rows.filter(r => r.t <= T + 1e-9); }

// ---------- scoreboard ----------
function median(xs) { if (!xs.length) return null; const s = [...xs].sort((a, b) => a - b); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2; }
function renderBoard() {
  $("#board").innerHTML = D.arms.map(a => {
    const v = visible(a), exps = v.filter(r => r.status !== "baseline");
    const keeps = exps.filter(r => r.status === "keep").length;
    const crashes = exps.filter(r => ["crash", "timeout", "rejected"].includes(r.status)).length;
    const best = v.length ? v[v.length - 1].best : null;
    const gain = best != null && BASE ? (1 - best / BASE) * 100 : null;  // lower is better
    const spent = v.length ? v[v.length - 1].cum : 0;
    const lat = median(exps.map(r => r.lat).filter(x => x != null));
    const think = exps.reduce((s, r) => s + r.think, 0);
    return `<div class="card" id="card-${a.id}" style="--pc:${a.color}66"><div class="stripe" style="background:${a.color}"></div>
      <div class="who"><b>${esc(a.label)}</b><span>${esc(a.model)} · ${esc(a.thinking)}</span></div>
      <div class="big"><span class="v">${fmt(best)}</span>
        <span><span class="g" style="color:${gain > 0 ? "var(--good)" : "var(--ink2)"}">${gain == null ? "" : (gain >= 0 ? "+" : "") + gain.toFixed(1) + "%"}</span><br>
        <span class="lab">best val_bpb · better than Karpathy's baseline</span></span></div>
      <div class="stats">
        <div><small>Experiments</small>${exps.length}</div>
        <div><small>Kept</small>${keeps}</div>
        <div><small>Crashed</small>${crashes}</div>
        <div><small>Spent</small>${money(spent)}</div>
        <div><small>$ / kept idea</small>${keeps ? money(spent / keeps) : "–"}</div>
        <div><small>${think ? "Thinking tok" : "Median LLM s"}</small>${think ? (think / 1000).toFixed(0) + "k" : (lat == null ? "–" : lat.toFixed(0))}</div>
      </div></div>`;
  }).join("");
}

// ---------- chart ----------
let W = 900, H = 430, M = { l: 62, r: 150, t: 14, b: 40 };
function xval(r) { return xmode === "t" ? r.t : xmode === "id" ? r.id : r.cum; }
function niceTicks(lo, hi, n) {
  const span = hi - lo || 1, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || mag * 10;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-12; v += step) out.push(+v.toFixed(10)); return out;
}
function renderChart() {
  W = Math.round(Math.min(900, Math.max(320, $("#chart").parentElement.clientWidth - 36)));
  const narrow = W < 600; H = narrow ? 300 : 430; M = { l: narrow ? 46 : 62, r: narrow ? 92 : 150, t: 14, b: 36 };
  $("#chart").setAttribute("viewBox", `0 0 ${W} ${H}`);
  const xmax = xmode === "t" ? Math.max(D.hours, Tmax) : Math.max(...allRows.map(xval), 1);
  // domain from the best-so-far lines + baseline band; worse experiments beyond it are pinned to the top edge
  const ylo0 = Math.min(BASE - 1.3 * EPS, ...bests), yhi0 = Math.max(BASE + 1.3 * EPS, ...bests);
  const span0 = (yhi0 - ylo0) || Math.abs(BASE) * 0.01 || 0.001;
  const ylo = ylo0 - span0 * 0.08, yhi = yhi0 + span0 * 0.9;
  const X = v => M.l + (v / xmax) * (W - M.l - M.r);
  const Y = v => M.t + (1 - (v - ylo) / (yhi - ylo)) * (H - M.t - M.b);
  let s = "";
  // grid + y ticks
  const yt = niceTicks(ylo, yhi, 5), ydp = Math.max(2, Math.min(5, -Math.floor(Math.log10((yt[1] - yt[0]) || 1e-3)) + 1));
  for (const v of yt) s += `<line x1="${M.l}" x2="${W - M.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/>` +
      `<text x="${M.l - 10}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v.toFixed(ydp)}</text>`;
  for (const v of niceTicks(0, xmax, W < 600 ? 4 : 8)) s += `<text x="${X(v)}" y="${H - M.b + 20}" text-anchor="middle" font-size="11" fill="var(--muted)">${xmode === "cum" ? "$" + v : xmode === "t" ? v + "h" : v}</text>`;
  s += `<line x1="${M.l}" x2="${W - M.r}" y1="${H - M.b}" y2="${H - M.b}" stroke="var(--line)"/>`;
  // noise band + baseline
  if (EPS) s += `<rect x="${M.l}" width="${W - M.l - M.r}" y="${Y(BASE + EPS)}" height="${Y(BASE - EPS) - Y(BASE + EPS)}" fill="#ffffff" opacity="0.045"/>`;
  s += `<line x1="${M.l}" x2="${W - M.r}" y1="${Y(BASE)}" y2="${Y(BASE)}" stroke="var(--ink2)" stroke-dasharray="4 5" opacity=".7"/>` +
       `<text x="${M.l + 8}" y="${Y(BASE) - 8}" font-size="11" fill="var(--ink2)">Karpathy's baseline${EPS ? " (band = ±1 seed std)" : ""}</text>`;
  // now-line in hours mode
  if (xmode === "t" && T < Tmax) s += `<line x1="${X(T)}" x2="${X(T)}" y1="${M.t}" y2="${H - M.b}" stroke="var(--ink)" opacity=".25"/>`;
  const ends = [];
  for (const a of D.arms) {
    const v = visible(a); if (!v.length) continue;
    // all experiment dots (behind)
    for (const r of v) {
      if (r.status === "baseline") continue;
      const x = X(xval(r));
      if (r.score == null) { s += `<path d="M${x - 4},${M.t + 2} l8,8 m0,-8 l-8,8" stroke="${a.color}" stroke-width="1.6" opacity=".7" data-a="${a.id}" data-i="${r.id}" class="hit"/>`; continue; }
      const off = r.score > yhi, y = off ? M.t + 16 : Y(r.score);
      if (r.status === "keep") continue;
      s += off ? `<path d="M${x - 4},${y + 3} l8,0 l-4,-6z" fill="${a.color}" opacity=".45"/>` : `<circle cx="${x}" cy="${y}" r="3.2" fill="${a.color}" opacity=".35"/>`;
    }
    // best-so-far step line
    let d = "", px = null, py = null;
    for (const r of v) {
      if (r.best == null) continue;
      const x = X(xval(r)), y = Y(r.best);
      if (px == null) d = `M${x},${y}`; else d += ` H${x} V${y}`;
      px = x; py = y;
    }
    const xEnd = xmode === "t" ? X(Math.min(T, Tmax)) : px;
    d += ` H${xEnd}`;
    s += `<path d="${d}" fill="none" stroke="${a.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    // kept markers on top
    for (const r of v.filter(r => r.status === "keep"))
      s += `<circle cx="${X(xval(r))}" cy="${Y(r.score)}" r="6" fill="${a.color}" stroke="var(--panel)" stroke-width="2"/>`;
    ends.push({ a, x: xEnd, y: py, v: v[v.length - 1].best });
  }
  // direct labels at line ends, de-collided
  ends.sort((p, q) => p.y - q.y);
  for (let i = 1; i < ends.length; i++) { const prev = ends[i - 1].ly || ends[i - 1].y; if ((ends[i].ly || ends[i].y) - prev < 36) ends[i].ly = prev + 36; }
  for (const e of ends) { const ly = e.ly || e.y;
    s += `<circle cx="${e.x}" cy="${e.y}" r="4.5" fill="${e.a.color}"/>` +
         `<text x="${e.x + 12}" y="${ly - 2}" font-size="12.5" font-weight="700" fill="var(--ink)">${esc(e.a.label)}</text>` +
         `<text x="${e.x + 12}" y="${ly + 13}" font-size="12" fill="var(--ink2)">${fmt(e.v)}</text>`; }
  // hover targets
  for (const a of D.arms) for (const r of visible(a)) {
    if (r.status === "baseline") continue;
    const y = r.score == null ? M.t + 6 : (r.score > yhi ? M.t + 16 : Y(r.score));
    s += `<circle cx="${X(xval(r))}" cy="${y}" r="10" fill="transparent" class="hit" data-a="${a.id}" data-i="${r.id}"/>`;
  }
  $("#chart").innerHTML = s;
  $("#ylab").textContent = `x: ${xmode === "t" ? "hours of wall-clock" : xmode === "id" ? "experiment number" : "API $ spent"} · dots = every experiment, big = kept, ▲ = much worse`;
}

function renderFeed(full) {

      return `<tr><td>${esc(lab(n))}</td><td>${pm(f.test_bpb)}</td>` +
        `<td>${f.test_gain_pct == null ? "–" : (f.test_gain_pct >= 0 ? "+" : "") + f.test_gain_pct.toFixed(2) + "%"}</td>` +
        `<td>${n === "baseline" ? "–" : f.beats_2x_seed_std ? "✓ yes" : "✗ no"}</td>` +
        `<td>${f.best_val_bpb == null ? "–" : f.best_val_bpb.toFixed(4)}</td><td>${f.experiments ?? "–"}</td></tr>`; }).join("");
}
$("#foot").innerHTML = `Built on Karpathy's autoresearch (MIT). Same instructions, GPU type and limits for every model; each runs at its own default reasoning setting. ` +
  `The held-out test shard is invisible during the night; every train.py is checked before it runs; scores come from Karpathy's fixed evaluate_bpb. ` +
  `Harness built with Claude Opus 5.5, which is also the comparison model. Built ${esc(D.built)}.`;

// ---------- clock / replay ----------
function renderClock() {
  $("#clock").innerHTML = `Hour ${T.toFixed(1)} <small>/ ${Math.max(D.hours, Tmax).toFixed(Math.max(D.hours, Tmax) < 10 ? 1 : 0)}h</small>`;
  $("#scrub").value = Math.round(T / Tmax * 1000);
}
function pulseKeeps() {
  for (const a of D.arms) { const k = visible(a).filter(r => r.status === "keep").length;
    if (prevKeeps[a.id] != null && k > prevKeeps[a.id]) { const c = $("#card-" + a.id); c && (c.classList.remove("pulse"), void c.offsetWidth, c.classList.add("pulse")); }
    prevKeeps[a.id] = k; }
}
function render(fullFeed) { renderBoard(); pulseKeeps(); renderChart(); renderFeed(fullFeed); renderClock(); }
function frame(ts) {
  if (!playing) return;
  const dt = lastFrame ? (ts - lastFrame) / 1000 : 0; lastFrame = ts;
  T = Math.min(Tmax, T + dt * Tmax / dur);
  render(false);
  if (T >= Tmax) { playing = false; $("#play").textContent = "▶ Replay"; return; }
  requestAnimationFrame(frame);
}
$("#play").onclick = () => {
  if (playing) { playing = false; $("#play").textContent = "▶ Resume"; return; }
  if (T >= Tmax) { T = 0; prevKeeps = {}; render(true); }
  playing = true; lastFrame = 0; $("#play").textContent = "❚❚ Pause"; requestAnimationFrame(frame);
};
$("#scrub").oninput = e => { playing = false; $("#play").textContent = "▶ Replay"; T = e.target.value / 1000 * Tmax; prevKeeps = {}; render(true); };
document.querySelectorAll("#speed button").forEach(b => b.onclick = () => { dur = +b.dataset.s;
  document.querySelectorAll("#speed button").forEach(x => x.classList.toggle("on", x === b)); });
document.querySelectorAll("#xmode button").forEach(b => b.onclick = () => { xmode = b.dataset.m;
  document.querySelectorAll("#xmode button").forEach(x => x.classList.toggle("on", x === b)); renderChart(); });
document.querySelectorAll("#feedmode button").forEach(b => b.onclick = () => { feedmode = b.dataset.f;
  document.querySelectorAll("#feedmode button").forEach(x => x.classList.toggle("on", x === b)); renderFeed(true); });
const live = new URLSearchParams(location.search).get("live"); if (live) setTimeout(() => location.reload(), +live * 1000);
addEventListener("resize", () => renderChart());
render(true);
</script>
